---
- name: Set up IOTA node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator, ssfn]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run node role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include node role
          ansible.builtin.include_role:
            name: node
            public: true

  post_tasks:
    - name: Verify node
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ node_log_file_path }}"
            version_command: "{{ node_bin_dir }}/{{ service_identifier }} --version"
            expected_version: "{{ iota[type].version | regex_replace('^v', '') }}"
            # validators serve no JSON-RPC, so they are checked on their metrics endpoint
            health_url: >-
              {{ 'http://localhost:' ~ iota.ssfn.ports.rpc_port ~ '/health' if type == 'ssfn'
                 else 'http://localhost:' ~ metrics_port ~ '/metrics' }}
